<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play a local chess game with two players.">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="game.js"></script>
    <title>Local Game</title>
</head>
<body>
    <header>Tech Chess</header>

    <div class="main-layout">
        <nav class="sidebar" aria-label="Main menu">
            <h2>Menu</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="play.html">Play</a></li>
                <li>
                    <a href="study.html">Learn</a>
                    <ul class="learn-links">
                        <li><a href="coordinates.html">Coordinates</a></li>
                    </ul>
                </li>
            </ul>
        </nav>

        <main class="content">
            <section class="content-card game-page">
                <h1 class="card-title">Local Game</h1>
                <div class="game-player">
                    <p id="black-player">Player 2</p>
                    <p id="black-clock" class="game-clock" aria-label="Black time remaining"></p>
                </div>
                <div id="game-board" class="chessboard" aria-label="Chessboard"></div>
                <div class="game-player">
                    <p id="white-player">Player 1</p>
                    <p id="white-clock" class="game-clock" aria-label="White time remaining"></p>
                </div>
                <p id="game-status" role="status">White to move</p>
                <button id="new-game" class="new-game-button" type="button">New game</button>
                <section class="move-history" aria-labelledby="move-history-title">
                    <h2 id="move-history-title">Move history</h2>
                    <p id="empty-history">No moves yet.</p>
                    <ol id="move-history"></ol>
                </section>
            </section>

            <dialog id="promotion-dialog" class="promotion-dialog" aria-labelledby="promotion-title">
                <h2 id="promotion-title">Promote pawn</h2>
                <p>Choose a piece:</p>
                <div class="promotion-options">
                    <button type="button" data-promotion="q">
                        <img src="pieces/wQ.svg" alt=""><span>Queen</span>
                    </button>
                    <button type="button" data-promotion="r">
                        <img src="pieces/wR.svg" alt=""><span>Rook</span>
                    </button>
                    <button type="button" data-promotion="b">
                        <img src="pieces/wB.svg" alt=""><span>Bishop</span>
                    </button>
                    <button type="button" data-promotion="n">
                        <img src="pieces/wN.svg" alt=""><span>Knight</span>
                    </button>
                </div>
                <button id="cancel-promotion" class="promotion-cancel" type="button">Cancel</button>
            </dialog>
        </main>

        <aside class="sidebar" aria-label="More sections">
            <h2>Menu</h2>
            <ul>
                <li><a href="tournaments.html">Tournaments</a></li>
                <li><a href="players.html">Players</a></li>
            </ul>
        </aside>
    </div>

    <footer></footer>
</body>
</html>
